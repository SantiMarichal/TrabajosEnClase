<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" href="/frontend/css/style-usuarios.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Administración de usuarios</h1>
            <div class="informacion-usuario">
                <p>Usuario:<span id="nombreUsuario"></span></p>
                <p>Rol:<span id="rolUsuario"></span></p>
            </div>
        </div>
        <button id="btnLogout">Cerrar sesión</button>
    </header>
    <main class="container">
        <section id="administracion" class="panel">
            <div class="panel-header">
                <h2>Usuarios</h2>
                <button id="btnNuevo">Nuevo usuario</button>
            </div>
            <div class="tabla-container">
                <table>
                    <thead>
                        <tr>
                            <th>CI</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modalNuevo" class="modal">
        <div class="modal-contenido">
            <div class="modal-header">
                <h2>Nuevo usuario</h2>
                <button type="button" id="btnCerrarModal" class="btn-cerrar">&times;</button>
            </div>

            <form id="formNuevoUsuario">
                <div class="campo">
                    <label for="ci">CI</label>
                    <input type="text" id="ci" name="ci" maxlength="10" required>
                </div>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" maxlength="30" required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" maxlength="30" required>
                </div>

                <div class="campo">
                    <label for="user">Usuario</label>
                    <input type="text" id="user" name="user" maxlength="30"required>
                </div>

                <div class="campo">
                    <label for="pass">Contraseña</label>
                    <input type="password" id="pass" name="pass" maxlength="30" required>
                </div>

                <div class="campo">
                    <label for="rol">Rol</label>

                    <select id="rol" name="rol" required>
                        <option value="">Seleccione un rol</option>
                        <option value="user">Usuario</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <p id="mensajeNuevo"></p>

                <div class="modal-acciones">
                    <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
                    <button type="submit">Crear usuario</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/frontend/js/usuarios-main.js"></script>
    <script src="/frontend/js/usuarios-gestion.js"></script>

</body>
</html>
